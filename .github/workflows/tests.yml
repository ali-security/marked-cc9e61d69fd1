name: "Tests"
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  Test:
    # Single pinned Node 16 leg. Node 8 is excluded: the pinned dev toolchain
    # (rollup@2.49.0 declares engines ">=10.0.0", eslint@7.27.0) hard-fails on
    # Node 8, and Node 8 is not provisionable on current GitHub runners.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        run: npm run test:specs

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Pack 📦
        run: npm pack
      - name: Upload Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
